				"  --exclude 'previews/' \\",
				"  --exclude 'README*' \\",
				"  --exclude 'PRD*' \\",
				"  --exclude '.DS_Store' \\",
				"  \"$WEB_SRC/\" \"$WEB_DST/\"",
				"",
				"if [ ! -f \"$WEB_DST/index.html\" ]; then",
				"  echo \"ERROR: index.html was not copied\"",
				"  exit 1",
				"fi",
				"",
				"echo \"Connect 4 web files copied successfully.\"",
