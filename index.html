    <style>
      /* Opening screen: inline so it paints before anything else loads. */
      html,body{margin:0;background:#fffaf0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
      .boot{--slot:clamp(44px,7.4vmin,76px);position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:calc(var(--slot)*.62);overflow:hidden;background:#fffaf0;color:#242137;font:800 clamp(18px,3vmin,28px)/1.2 ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;letter-spacing:.01em}
      .boot[hidden]{display:none}
      .boot__pool{position:absolute;width:64vmax;height:64vmax;border-radius:42% 58% 63% 37%/41% 44% 56% 59%;background:radial-gradient(circle,#0000001c 2.4px,transparent 2.9px) 0 0/14px 14px,var(--c);animation:boot-pool 9s ease-in-out infinite alternate}
      .boot__pool:nth-child(1){--c:#ff74ab;left:-40vmax;top:-44vmax}
      .boot__pool:nth-child(2){--c:#ffe14a;right:-42vmax;top:-40vmax;animation-delay:-3s}
      .boot__pool:nth-child(3){--c:#3fb2ff;left:-30vmax;bottom:-46vmax;animation-delay:-5s}
      .boot__pool:nth-child(4){--c:#ff74ab;right:-44vmax;bottom:-48vmax;animation-delay:-7s}
      @keyframes boot-pool{50%{border-radius:58% 42% 37% 63%/56% 59% 41% 44%}to{transform:rotate(40deg) scale(1.06)}}
      .boot__board{position:relative;display:flex;gap:calc(var(--slot)*.26);padding:calc(var(--slot)*.26) calc(var(--slot)*.34);background:#266bff;border:4px solid #242137;border-radius:calc(var(--slot)*.56);box-shadow:0 7px 0 #242137,inset 0 -6px 0 #1a4fd0}
      .boot__slot{position:relative;width:var(--slot);height:var(--slot);border-radius:50%;background:#153d9e;box-shadow:inset 0 5px 0 #0d2a73,0 0 0 3px #242137}
      .boot__slot::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffffffb8 0 13%,transparent 14%),radial-gradient(circle,var(--chip) 0 50%,#00000024 51% 57%,var(--chip) 58%);box-shadow:0 0 0 3px #242137;animation:boot-chip 2.8s cubic-bezier(.3,.7,.4,1) calc(var(--i)*.16s) infinite both}
      .boot__slot:nth-child(odd){--chip:#ff2d6d}.boot__slot:nth-child(even){--chip:#ffd21e}
      @keyframes boot-chip{0%{transform:translateY(-160%);opacity:0}9%{opacity:1}16%{transform:translateY(0)}21%{transform:translateY(-16%)}26%{transform:scale(1.07,.93)}30%,62%{transform:none}68%{transform:scale(1.18)}74%,86%{transform:none;opacity:1}100%{transform:translateY(190%);opacity:0}}
      .boot__bar{width:calc(var(--slot)*5.4);max-width:72vw;height:calc(var(--slot)*.4);padding:3px;border:3px solid #242137;border-radius:99px;background:#fff;box-shadow:0 4px 0 #242137;box-sizing:border-box}
      .boot__bar i{display:block;height:100%;min-width:10px;width:calc(var(--progress,0)*100%);border-radius:99px;background:repeating-linear-gradient(-45deg,#ff2d6d 0 8px,#ff6a9a 8px 16px) 0 0/22.63px 22.63px;transition:width .35s cubic-bezier(.3,.8,.3,1);animation:boot-stripes .6s linear infinite}
      @keyframes boot-stripes{to{background-position:22.63px 0}}
      .boot__label,.boot__bar,.boot__board{position:relative}
      .boot button{font:inherit;padding:10px 24px;border:3px solid #242137;border-radius:99px;background:#ffd21e;color:#242137;box-shadow:0 4px 0 #242137}
      @media(prefers-reduced-motion:reduce){.boot__pool,.boot__slot::after,.boot__bar i{animation:none}}
    </style>

</svg>

    <div class="app" id="appRoot" inert aria-hidden="true">
      <button id="btnHome" class="homeReturn" type="button" aria-label="Return to Home" title="Return to Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7L17 17M17 7L7 17"/></svg></button>
      <div class="appBg" aria-hidden="true">
        <canvas id="backgroundFlow" class="appBg__canvas"></canvas>
      </div>

      <main class="main">
        <section class="stage">
          <div class="brandLogo" role="img" aria-label="Connect 4Live">
            <img class="brandLogo__connect" src="./assets/figma/main-connect-sharp.svg?v=49" alt="" draggable="false" />
            <img class="brandLogo__live" src="./assets/figma/main-4live-sharp.svg?v=49" alt="" draggable="false" />
          </div>

          <div class="boardWrap" id="boardWrap">
            <div class="ghostRow" id="ghostRow" aria-hidden="true"></div>

            <div class="boardArea" aria-label="Board area">
              <div class="boardCore">
                <div class="layers">
                  <canvas id="boardCanvas" class="layer layer--pieces" width="1400" height="1200" aria-label="Pieces layer"></canvas>
                  <canvas id="frameCanvas" class="layer layer--frame" width="1400" height="1200" aria-label="Board frame layer" aria-hidden="true"></canvas>
                  <div id="hitLayer" class="layer logical-grid" aria-hidden="true"></div>
                </div>
              </div>
              <div class="colLabels" id="colLabels" aria-hidden="true">
                <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
              </div>
            </div>
          </div>
        </section>

        <img class="analysis__swan" src="./assets/figma/swan-painter.png?v=49" alt="" draggable="false" aria-hidden="true" />
        <aside class="rail" aria-label="Side panels">
          <section class="analysis" aria-label="Analysis and notes" data-page="moves" data-editing="false">


            <header class="analysis__header">
              <button class="analysis__heading analysis__page-toggle" type="button" aria-label="Switch to notes page">Analysis <span class="analysis__page-dots" aria-hidden="true">● ○</span></button>
              <div class="analysis__title">
                <span class="analysis__side analysis__side--red">Red</span>
                <span class="analysis__sep">/</span>
                <span class="analysis__side analysis__side--yellow">Yellow</span>
              </div>
              <div class="analysis__subtitle">Tap a move to explore</div>
            </header>

            <div class="analysis__pages">
              <section class="analysis__moves" aria-label="Move history">
            <ol class="timeline" id="timeline"></ol>

            <div class="travel analysis__travel">
              <button class="navBtn" id="btnStart" type="button" title="Start" aria-label="Jump to start"><svg class="navIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5V19 M18 6L11 12L18 18" /></svg></button>
              <button class="navBtn" id="btnPrev" type="button" title="Previous" aria-label="Previous"><svg class="navIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6L9 12L15 18" /></svg></button>
              <button class="navBtn" id="btnNext" type="button" title="Next" aria-label="Next"><svg class="navIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6L15 12L9 18" /></svg></button>
              <button class="navBtn" id="btnEnd" type="button" title="Last move in this line" aria-label="Jump to last move in current line"><svg class="navIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 5V19 M6 6L13 12L6 18" /></svg></button>
              <div class="travel__pos" aria-hidden="true"><span id="stepNow">0</span></div>
            </div>

              </section>
              <section class="analysis__paper" aria-label="Handwritten notes" inert aria-hidden="true">
              </section>
            </div>
            <div class="dock" role="toolbar" aria-label="Game tools">
              <button class="dockBtn dockBtn--edit" id="btnEdit" type="button" title="Draw with pen" aria-pressed="false">
                <span class="dockBtn__icon" aria-hidden="true">✎</span>
                <span class="dockBtn__label">Edit</span>
              </button>
              <button class="dockBtn" id="btnNew" type="button" title="New game">
                <span class="dockBtn__icon" aria-hidden="true">＋</span>
                <span class="dockBtn__label">New</span>
              </button>
              <button class="dockBtn" id="btnSave" type="button" title="Save">
                <span class="dockBtn__icon" aria-hidden="true"><svg class="saveIcon" viewBox="0 0 24 24"><path d="M12 4V18M6 12L12 18L18 12"/></svg></span>
                <span class="dockBtn__label">Save</span>
              </button>
              <button class="dockBtn" id="btnReview" type="button" title="Review">
                <span class="dockBtn__icon" aria-hidden="true">★</span>
                <span class="dockBtn__label">Review</span>
              </button>
              <button class="dockBtn dockBtn--eraser" id="btnEraser" type="button" hidden aria-pressed="false" aria-label="Eraser. Hold three seconds to clear this page" title="Eraser · hold 3s to clear this page"><span class="dockBtn__icon" aria-hidden="true">▱</span><span class="dockBtn__label">Eraser</span></button>
              <button class="dockBtn dockBtn--undo" id="btnNoteUndo" type="button" hidden aria-label="Undo note" title="Undo"><span class="dockBtn__icon" aria-hidden="true">↶</span><span class="dockBtn__label">Undo</span></button>
              <button class="dockBtn dockBtn--redo" id="btnNoteRedo" type="button" hidden aria-label="Redo note" title="Redo"><span class="dockBtn__icon" aria-hidden="true">↷</span><span class="dockBtn__label">Redo</span></button>
            </div>
          </section>

          <section class="minigame" id="bottomModule" aria-label="Game modules" data-module="picker">
            <div class="module__cover">
              <div class="module__track">
                <div class="module__slide module__slide--clock">
                  <button class="module__logo" data-enter-mode="clock" aria-label="Enter Game Clock"><img src="./assets/modules/clock-logo.png" alt="Game Clock" draggable="false" /></button>
                  <button class="module__arrow" data-select-mode="1" aria-label="Next mode: Orbit"><img src="./assets/modules/arrow.png" alt="" draggable="false" /></button>
                </div>
                <div class="module__slide module__slide--orbit" inert aria-hidden="true">
                  <button class="module__logo" data-enter-mode="orbit" aria-label="Enter Orbit"><img src="./assets/modules/orbit-logo.png" alt="Orbit" draggable="false" /></button>
                  <button class="module__arrow module__arrow--left" data-select-mode="0" aria-label="Previous mode: Game Clock"><img src="./assets/modules/arrow.png" alt="" draggable="false" /></button>
                </div>
              </div>
            </div>
            <div class="clock" id="gameClock" data-module-pane="clock" data-state="setup" data-status="setup">
              <div class="clock__art" aria-hidden="true"></div>
              <div class="clock__setup">
                <h2 class="clock__heading"><img src="./assets/modules/clock-title.png" alt="Game Clock" draggable="false" /></h2>
                <div class="clock__presets" role="group" aria-label="Choose a time control"></div>
              </div>
              <div class="clock__new-board" hidden><span>Start a fresh board for timed play</span><button type="button">New timed game</button></div>
              <span class="clock__caption" hidden>GAME CLOCK</span>
              <output class="clock__time clock__time--red" role="timer" aria-live="off" hidden>05:00</output>
              <output class="clock__time clock__time--yellow" role="timer" aria-live="off" hidden>05:00</output>
              <div class="clock__result" hidden>
                <strong class="clock__winner"></strong>
                <span class="clock__reason"></span>
                <output class="clock__result-time"></output>
              </div>
              <button class="clock__return" type="button" hidden>Back to live game</button>
              <span class="clock__announcement sr-only" role="status" aria-live="polite"></span>
            </div>
            <div class="orbit" data-module-pane="orbit" hidden tabindex="0" aria-label="Orbit. Tap this panel or the game controller to hit the target.">
              <img class="orbit__logo" src="./assets/modules/orbit-logo.png" alt="Orbit" draggable="false" />
              <div class="orbit__stats">0 Hits · 0:00</div>
              <div class="orbit__lives" aria-label="Extra lives: earn five white hits, three gold hits or one red hit"></div>
              <div class="orbit__dial"><img src="./assets/modules/orbit-dial.png" alt="" draggable="false" /><canvas width="600" height="600" aria-hidden="true"></canvas></div>
              <span class="orbit__feedback" aria-live="off"></span>
              <div class="orbit__overlay"><strong class="orbit__message">Tap when the hand meets the bar</strong><button class="orbit__action" type="button">Start</button></div>
            </div>
            <button class="module__back" type="button" aria-label="Back to modes" hidden>‹ Modes</button>
            <button class="module__timed" type="button" hidden>Live Clock</button>
            <img class="minigame__frame" src="./assets/figma/main-minigame.png" alt="" draggable="false" />
          </section>

          <button class="decoGamepad" type="button" aria-label="Hit Orbit target" disabled><img src="./assets/figma/gamepad.png" alt="" draggable="false" /></button>
        </aside>
      </main>
      <canvas id="noteCanvas" class="workspaceInk" width="1400" height="1000" aria-label="Move annotation surface"></canvas>
      <canvas id="paperCanvas" class="workspaceInk" width="1400" height="1000" aria-label="Full screen notebook surface" hidden></canvas>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <span id="turnText" role="status" aria-live="polite" class="sr-only">Red to move</span>
